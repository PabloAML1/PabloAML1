name: Actualizar contribuciones 3D

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/contribuciones-3d.yml
      - .github/contribuciones-3d.json

permissions:
  contents: write

concurrency:
  group: contribuciones-3d
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PabloAML1
          SETTING_JSON: .github/contribuciones-3d.json
      - name: Publicar el mapa actualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile-3d-contrib/contribuciones.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar mapa de contribuciones'
            git push origin HEAD:main
          fi
